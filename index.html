<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>LogicForge Studio — Digital Logic Simulator</title>
<style>
  :root { --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --acc:#2563eb; --bg:#f1f5f9; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { display:grid; grid-template-rows:auto 1fr auto; background:var(--bg); color:var(--ink);
    font:13px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); }
  .brand { font-size:16px; } .tag { color:var(--muted); font-size:12px; }
  .tb { display:flex; flex-wrap:wrap; gap:6px; margin-left:auto; }
  button, select, input { font:inherit; color:inherit; }
  button { cursor:pointer; padding:5px 10px; background:#fff; border:1px solid #cbd5e1; border-radius:8px; }
  button:hover:not(:disabled) { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  button[aria-pressed="true"] { background:#dbeafe; border-color:var(--acc); }
  button:focus-visible, input:focus-visible, select:focus-visible, svg:focus-visible { outline:3px solid #93c5fd; outline-offset:1px; }
  main { display:grid; grid-template-columns:190px 1fr 230px; min-height:0; }
  aside { overflow:auto; padding:10px; background:#fff; border:0 solid var(--line); }
  #palette { border-right-width:1px; } #props { border-left-width:1px; }
  aside h2 { margin:0 0 8px; font-size:14px; } aside h3 { margin:12px 0 5px; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
  .pi { display:block; width:100%; margin-bottom:4px; text-align:left; font-size:12px; }
  .legend { margin-top:14px; font-size:11px; color:var(--muted); } .legend div { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .legend i { width:18px; height:4px; border-radius:2px; display:inline-block; }
  .foot { margin-top:14px; font-size:10.5px; color:var(--muted); }
  #props label { display:block; margin:8px 0; font-size:12px; color:var(--muted); }
  #props label input:not([type=checkbox]), #props label select { display:block; width:100%; margin-top:3px; padding:5px 7px; border:1px solid #cbd5e1; border-radius:7px; color:var(--ink); }
  #props .chk { display:flex; gap:6px; align-items:center; } .pt { font-weight:700; margin:0 0 4px; }
  .btns { display:flex; gap:6px; margin-top:12px; } .hint { color:var(--muted); font-size:12px; } .hint li { margin:3px 0; } .note { font-size:11px; color:var(--muted); }
  #stage { position:relative; min-width:0; min-height:0; }
  #cv { display:block; width:100%; height:100%; background:#f8fafc; touch-action:none; user-select:none; }
  #cv text { pointer-events:none; user-select:none; }
  #banner { position:absolute; left:10px; right:10px; top:10px; display:none; padding:8px 12px; color:#7f1d1d; background:#fee2e2; border:1px solid #fca5a5; border-radius:10px; font-weight:600; }
  #banner.on { display:block; }
  footer#foot { display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 14px; padding:5px 12px; background:#fff; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
  .fl { display:flex; flex-wrap:wrap; gap:4px 12px; }
  .lk { padding:0; background:none; border:0; color:var(--acc); text-decoration:underline; font-size:12px; }
  .body { fill:#fff; stroke:#111827; stroke-width:2; } .stub { stroke:#111827; stroke-width:2; } .ln { fill:none; stroke:#111827; stroke-width:2; }
  .pn { font:9px system-ui,sans-serif; fill:#475569; } .ttl { font:bold 9px system-ui,sans-serif; fill:#0f172a; }
  .lbl { font:600 11px system-ui,sans-serif; fill:#1e293b; } .big { font:bold 18px ui-monospace,Consolas,monospace; fill:#0f172a; }
  .hexc { font:bold 34px ui-monospace,Consolas,monospace; fill:#0f172a; } .clk { fill:none; stroke:#111827; stroke-width:1.5; }
  .hit { fill:transparent; cursor:grab; } .selbox { fill:rgba(37,99,235,.06); stroke:var(--acc); stroke-dasharray:4 3; }
  .ph { fill:transparent; pointer-events:all; cursor:crosshair; } .ph:hover { fill:rgba(37,99,235,.28); }
  .wp { fill:none; stroke-width:2.5; stroke-linejoin:round; } .wh { fill:none; stroke:transparent; stroke-width:12; pointer-events:stroke; cursor:pointer; }
  .w0 .wp { stroke:#4b5563; } .w1 .wp { stroke:#16a34a; } .wX .wp { stroke:#f59e0b; stroke-dasharray:6 4; }
  .wZ .wp { stroke:#2563eb; } .wR .wp { stroke:#dc2626; stroke-width:4; } .wsel .wp { filter:drop-shadow(0 0 3px #2563eb); }
  .wprev { fill:none; stroke:var(--acc); stroke-width:2; stroke-dasharray:5 4; pointer-events:none; }
  .rb { fill:rgba(37,99,235,.08); stroke:var(--acc); stroke-dasharray:4 3; pointer-events:none; }

  /* legal center + consent notice */
  #consent { position:fixed; left:10px; right:10px; bottom:42px; z-index:50; display:none; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:10px 14px; background:#0f172a; color:#f8fafc; border-radius:12px; box-shadow:0 4px 20px rgb(15 23 42/35%); font-size:12.5px; }
  #consent.on { display:flex; } #consent p { margin:0; flex:1 1 320px; } #consent .lk { color:#93c5fd; font-size:12.5px; }
  #consent button.ok { background:#2563eb; color:#fff; border-color:#2563eb; font-weight:600; }
  #legal { position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:12px; background:rgb(15 23 42/55%); }
  #legal.on { display:flex; }
  .dlg { display:flex; flex-direction:column; width:min(860px,100%); max-height:92vh; background:#fff; border-radius:14px; box-shadow:0 10px 40px rgb(15 23 42/40%); overflow:hidden; }
  .dh { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); }
  .dh h2 { margin:0; font-size:15px; }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; padding:8px 12px; border-bottom:1px solid var(--line); background:#f8fafc; }
  .tabs button { font-size:12px; padding:4px 9px; }
  .pane { padding:14px 18px; overflow:auto; line-height:1.55; }
  .pane h3 { margin:16px 0 4px; font-size:13px; text-transform:none; letter-spacing:0; color:var(--ink); }
  .pane h3:first-child { margin-top:0; } .pane p, .pane li { margin:5px 0; } .pane ul { padding-left:20px; }
  .pane pre { white-space:pre-wrap; padding:10px; background:#f1f5f9; border-radius:8px; font:12px/1.5 ui-monospace,Consolas,monospace; }
  .pane .upd { color:var(--muted); font-size:12px; } .pane .box { padding:8px 12px; background:#fef3c7; border:1px solid #fcd34d; border-radius:8px; }
  .pane .danger { background:#fff; color:#b91c1c; border-color:#fca5a5; }
  @media (max-width:900px) {
    main { grid-template-columns:130px 1fr; }
    #props { position:fixed; right:0; bottom:28px; width:220px; max-height:50vh; border:1px solid var(--line); border-radius:12px 0 0 0; box-shadow:0 2px 12px rgb(15 23 42/15%); }
  }
</style>
</head>
<body>
<header>
  <strong class="brand">LogicForge Studio</strong><span class="tag">Schematic &amp; simulation core</span>
  <div class="tb" role="toolbar" aria-label="Main toolbar">
    <button id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="run" aria-pressed="false" title="Run all clock generators">▶ Run</button>
    <button id="step" title="Toggle every clock once (half cycle)">Step ½ cycle</button>
    <button id="reset" title="Reset all sequential state to X">Reset sim</button>
    <button id="wire" title="Toggle wire routing style"></button>
    <button id="snap" aria-pressed="true"></button>
    <button id="panBtn" aria-pressed="false" title="Drag the canvas to pan (also: middle mouse, Alt or Space)"></button>
    <button id="fit">Fit view</button>
    <button id="del" title="Delete selection (Del)">Delete</button>
    <button id="clear">Clear all</button>
    <button id="legalBtn" title="Terms, privacy, licenses, accessibility">⚖ Legal</button>
  </div>

<main>
  <aside id="palette" aria-label="Component library"></aside>
  <section id="stage">
    <div id="banner" role="alert"></div>
    <svg id="cv" tabindex="0" role="application" aria-label="Schematic canvas. Drag from a pin to another pin to create a wire.">
      <defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#cbd5e1"/></pattern></defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <g id="view"><g id="gw"></g><g id="gc"></g><g id="go"></g></g>
    </svg>
  </section>
  <aside id="props" aria-label="Properties"></aside>
</main>
<footer id="foot">

</footer>

<div id="consent" role="region" aria-label="Terms notice">
  <p>This is an educational simulator provided “as is”, with no warranty. Circuits are stored only in your browser; nothing is sent to a server. By clicking “I agree” or continuing to use the site you accept the <button class="lk" data-l="terms">Terms of Use</button>, <button class="lk" data-l="disclaimer">Disclaimer</button> and <button class="lk" data-l="privacy">Privacy Notice</button>.</p>
  <button class="ok" id="consentOk">I agree</button>
</div>

<div id="legal" role="dialog" aria-modal="true" aria-labelledby="legalTitle">
  <div class="dlg">
    <div class="dh"><h2 id="legalTitle">Legal &amp; Compliance Center</h2><button id="legalClose" aria-label="Close legal center">✕ Close</button></div>
    <div class="tabs" role="tablist" id="legalTabs" aria-label="Legal documents"></div>
    <div class="pane" id="legalPane" role="tabpanel" tabindex="0"></div>
  </div>
</div>

<script>
"use strict";
/* ============ EDIT THESE BEFORE PUBLISHING ============ */
const LEGAL = {
  site: "LogicForge Studio",
  owner: "[Ivan Haieen]",
  email: "[Ivanhaieen3@gmail.com]",
  court: "[YOUR DISTRICT, e.g. Tel Aviv-Jaffa]",
  updated: "2026-11-13",
  version: 1
};

/* ============ constants & helpers ============ */
const X = 2, Z = 3, GRID = 20;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m]));
const nm = (p, n) => Array.from({ length: n }, (_, i) => p + i);
const ch = v => v === 0 ? "0" : v === 1 ? "1" : v === X ? "X" : "Z";
const col = v => v === 1 ? "#16a34a" : v === 0 ? "#374151" : v === X ? "#f59e0b" : "#2563eb";

/* ============ component definitions ============ */
const DEFS = {};
function def(type, name, cat, ins, outs, p) { DEFS[type] = { name, cat, ins, outs, p: p || {} }; }
const GATES = ["AND", "OR", "NAND", "NOR", "XOR", "XNOR"];
const IO = "Input / Output", CG = "Combinational Gates", PA = "Plexers & Arithmetic", SQ = "Sequential";
def("SWITCH", "Toggle Switch", IO, [], ["Q"], { v: 0 });
def("BUTTON", "Push Button", IO, [], ["Q"]);
def("CLOCK", "Clock Generator", IO, [], ["CLK"], { hz: 1 });
def("HIGH", "Constant High (1)", IO, [], ["Q"]);
def("LOW", "Constant Low (0)", IO, [], ["Q"]);
def("LED", "LED Indicator", IO, ["A"], []);
def("SEG7", "7-Segment Display", IO, p => p.dec ? nm("D", 4) : ["a","b","c","d","e","f","g"], [], { dec: 1 });
def("HEX", "Hex Display", IO, nm("D", 4), []);
GATES.forEach(g => def(g, g, CG, p => ["A","B","C","D"].slice(0, p.n), ["Y"], { n: 2 }));
def("NOT", "NOT", CG, ["A"], ["Y"]);
def("TRI", "Tri-State Buffer", CG, ["D","EN"], ["Y"]);
def("MUX2", "2:1 Multiplexer", PA, ["D0","D1","S"], ["Y"]);
def("MUX4", "4:1 Multiplexer", PA, ["D0","D1","D2","D3","S0","S1"], ["Y"]);
def("DEMUX2", "1:2 Demultiplexer", PA, ["D","S"], ["Y0","Y1"]);
def("DEMUX4", "1:4 Demultiplexer", PA, ["D","S0","S1"], nm("Y", 4));
def("HA", "Half Adder", PA, ["A","B"], ["S","C"]);
def("FA", "Full Adder", PA, ["A","B","CI"], ["S","CO"]);
def("ALU", "4-bit ALU (00 add, 01 sub, 10 AND, 11 OR)", PA, [...nm("A",4), ...nm("B",4), "OP0","OP1"], [...nm("Y",4), "CO","Z"]);
def("SR", "SR Latch", SQ, ["S","R"], ["Q","QN"]);
def("DFF", "D Flip-Flop", SQ, ["D","CLK","RST","PRE"], ["Q","QN"], { edge: "rise" });
def("JFF", "JK Flip-Flop", SQ, ["J","K","CLK","RST","PRE"], ["Q","QN"], { edge: "rise" });
def("TFF", "T Flip-Flop", SQ, ["T","CLK","RST","PRE"], ["Q","QN"], { edge: "rise" });
def("REG4", "4-bit Register", SQ, [...nm("D",4), "CLK","RST"], nm("Q", 4), { edge: "rise" });
def("CNT4", "4-bit Sync Counter", SQ, ["CLK","EN","RST"], [...nm("Q",4), "CO"], { edge: "rise" });
const CK = { DFF: 1, JFF: 2, TFF: 1, REG4: 4, CNT4: 0 };
const TITLE = { MUX2:"2:1 MUX", MUX4:"4:1 MUX", DEMUX2:"1:2 DEMUX", DEMUX4:"1:4 DEMUX", HA:"HALF ADD", FA:"FULL ADD",
  ALU:"ALU 4-BIT", SR:"SR LATCH", DFF:"D FF", JFF:"JK FF", TFF:"T FF", REG4:"REG 4", CNT4:"COUNTER" };
const pins = (c, side) => { const d = DEFS[c.type], v = side ? d.outs : d.ins; return typeof v === "function" ? v(c.p) : v; };

function layout(c) {
  const t = c.type, I = pins(c, 0), O = pins(c, 1);
  const colm = (a, x) => a.map((n, i) => ({ n, x, y: 20 * (i + 1) }));
  let w, h, ins, outs;
  if (GATES.includes(t) || t === "NOT") { w = 60; h = 20 * (I.length + 1); ins = colm(I, 0); outs = [{ n: "Y", x: 60, y: h / 2 }]; }
  else if (t === "TRI") { w = 60; h = 60; ins = colm(I, 0); outs = [{ n: "Y", x: 60, y: 30 }]; }
  else if (t === "SWITCH" || t === "BUTTON") { w = 60; h = 40; ins = []; outs = [{ n: "Q", x: 60, y: 20 }]; }
  else if (t === "CLOCK") { w = 80; h = 40; ins = []; outs = [{ n: "CLK", x: 80, y: 20 }]; }
  else if (t === "HIGH" || t === "LOW") { w = 40; h = 40; ins = []; outs = [{ n: "Q", x: 40, y: 20 }]; }
  else if (t === "LED") { w = 44; h = 40; ins = [{ n: "A", x: 0, y: 20 }]; outs = []; }
  else if (t === "SEG7" || t === "HEX") { w = 90; h = 20 * (I.length + 1); ins = colm(I, 0); outs = []; }
  else { w = 110; h = 20 * (Math.max(I.length, O.length) + 1); ins = colm(I, 0); outs = colm(O, 110); }
  return { w, h, ins, outs };
}

/* ============ model, selection, sim state ============ */
let M = { comps: [], wires: [], nid: 1 };
const idx = { by: new Map(), inW: new Map() };
const S = { sel: new Set(), selW: new Set(), ortho: true, snap: true, pan: false, view: { x: 40, y: 40, k: 1 }, running: false, msg: "" };
const sim = { out: {}, st: {}, prev: {}, osc: new Set(), cont: new Set() };
const H = { stack: [], i: -1 };
const single = () => S.sel.size === 1 ? idx.by.get([...S.sel][0]) : null;
const nameOf = c => c.p.label || (DEFS[c.type].name.split(" (")[0] + " #" + c.id);

function rebuild() {
  idx.by = new Map(M.comps.map(c => [c.id, c]));
  idx.inW = new Map();
  for (const w of M.wires) { const k = w.t[0] + ":" + w.t[1]; if (!idx.inW.has(k)) idx.inW.set(k, []); idx.inW.get(k).push(w); }
}
function newState(c) {
  if (c.type === "REG4" || c.type === "CNT4") return { q: [X, X, X, X] };
  if (c.type === "CLOCK") return { lvl: 0, acc: 0 };
  if (c.type === "BUTTON") return { down: 0 };
  return { q: X };
}
function ensureSim(c) {
  const n = pins(c, 1).length;
  if (!sim.out[c.id] || sim.out[c.id].length !== n) sim.out[c.id] = Array(n).fill(X);
  if (!sim.st[c.id]) sim.st[c.id] = newState(c);
}

/* ============ 4-valued logic ============ */
const nz = v => v === Z ? X : v;
const z0 = v => v === Z ? 0 : v;
const and = a => { let x = 0; for (let v of a) { v = nz(v); if (v === 0) return 0; if (v === X) x = 1; } return x ? X : 1; };
const or = a => { let x = 0; for (let v of a) { v = nz(v); if (v === 1) return 1; if (v === X) x = 1; } return x ? X : 0; };
const not = v => { v = nz(v); return v === X ? X : 1 - v; };
const xor = a => { let r = 0; for (let v of a) { v = nz(v); if (v === X) return X; r ^= v; } return r; };
const num = a => { let n = 0; for (let i = 0; i < a.length; i++) { if (a[i] > 1) return -1; n |= a[i] << i; } return n; };
const bits = (n, w) => Array.from({ length: w }, (_, i) => (n >> i) & 1);
const same4 = a => { const f = nz(a[0]); return f < 2 && a.every(v => nz(v) === f) ? f : X; };

function resolve(c, i, track) {
  const ws = idx.inW.get(c.id + ":" + i);
  if (!ws) return Z;
  let v = Z, clash = false;
  for (const w of ws) {
    const d = (sim.out[w.f[0]] || [])[w.f[1]], dv = d === undefined ? X : d;
    if (dv === Z) continue;
    if (v === Z) v = dv;
    else if (v !== dv) { if (v < 2 && dv < 2) clash = true; v = X; }
  }
  if (clash && track) ws.forEach(w => sim.cont.add(w.id));
  return v;
}
function readIns(c, track) {
  const n = pins(c, 0).length, r = new Array(n);
  for (let i = 0; i < n; i++) r[i] = resolve(c, i, track);
  return r;
}
function asyncCtl(st, rst, pre) { if (rst === 1) st.q = 0; else if (pre === 1) st.q = 1; }

function evalComp(c, I) {
  const t = c.type, st = sim.st[c.id];
  switch (t) {
    case "SWITCH": return [c.p.v ? 1 : 0];
    case "BUTTON": return [st.down ? 1 : 0];
    case "CLOCK": return [st.lvl];
    case "HIGH": return [1];
    case "LOW": return [0];
    case "AND": return [and(I)];
    case "OR": return [or(I)];
    case "NAND": return [not(and(I))];
    case "NOR": return [not(or(I))];
    case "XOR": return [xor(I)];
    case "XNOR": return [not(xor(I))];
    case "NOT": return [not(I[0])];
    case "TRI": { const e = I[1]; return [e === 1 ? nz(I[0]) : (e === 0 || e === Z) ? Z : X]; }
    case "MUX2": { const s = I[2]; return [s === 0 || s === 1 ? nz(I[s]) : same4([I[0], I[1]])]; }
    case "MUX4": { const s = num([I[4], I[5]]); return [s >= 0 ? nz(I[s]) : same4(I.slice(0, 4))]; }
    case "DEMUX2": { const s = num([I[1]]); if (s < 0) return [X, X]; const d = nz(I[0]); return [s === 0 ? d : 0, s === 1 ? d : 0]; }
    case "DEMUX4": { const s = num([I[1], I[2]]); if (s < 0) return [X, X, X, X]; const d = nz(I[0]); return [0, 1, 2, 3].map(i => i === s ? d : 0); }
    case "HA": return [xor([I[0], I[1]]), and([I[0], I[1]])];
    case "FA": { const ab = xor([I[0], I[1]]); return [xor([ab, I[2]]), or([and([I[0], I[1]]), and([I[2], ab])])]; }
    case "ALU": {
      const op = num([I[8], I[9]]);
      if (op < 0) return Array(6).fill(X);
      const A = I.slice(0, 4), B = I.slice(4, 8);
      const zero = Y => Y.some(v => v > 1) ? X : (Y.every(v => v === 0) ? 1 : 0);
      if (op >= 2) { const Y = A.map((a, i) => op === 2 ? and([a, B[i]]) : or([a, B[i]])); return [...Y, 0, zero(Y)]; }
      const a = num(A), b = num(B);
      if (a < 0 || b < 0) return Array(6).fill(X);
      const r = op === 0 ? a + b : a - b, Y = bits(r & 15, 4);
      return [...Y, op === 0 ? (r > 15 ? 1 : 0) : (a >= b ? 1 : 0), zero(Y)];
    }
    case "SR": {
      const s = z0(I[0]), r = z0(I[1]);
      if (s === X || r === X || (s === 1 && r === 1)) st.q = X; else if (s === 1) st.q = 1; else if (r === 1) st.q = 0;
      return [st.q, not(st.q)];
    }
    case "DFF": case "TFF": asyncCtl(st, I[2], I[3]); return [st.q, not(st.q)];
    case "JFF": asyncCtl(st, I[3], I[4]); return [st.q, not(st.q)];
    case "REG4": if (I[5] === 1) st.q = [0, 0, 0, 0]; return st.q.slice();
    case "CNT4": { if (I[2] === 1) st.q = [0, 0, 0, 0]; const en = I[1] === Z ? 1 : I[1]; return [...st.q, and([en, ...st.q])]; }
    default: return [];
  }
}

function clockStep(c, I) {
  const st = sim.st[c.id], t = c.type;
  if (t === "DFF") { if (I[2] === 1 || I[3] === 1) return; st.q = nz(I[0]); }
  else if (t === "TFF") { if (I[2] === 1 || I[3] === 1) return; const v = nz(I[0]); st.q = v === X ? X : v === 1 ? not(st.q) : st.q; }
  else if (t === "JFF") {
    if (I[3] === 1 || I[4] === 1) return;

  try { localStorage.setItem(CKEY, JSON.stringify({ v: LEGAL.version, at: new Date().toISOString() })); } catch (_) { /* storage unavailable */ }
  $("#consent").classList.remove("on");
}
function wipeData() {
  if (!confirm("Delete your saved circuit and your terms acceptance from this browser? This cannot be undone.")) return;
  try { localStorage.removeItem(KEY); localStorage.removeItem(CKEY); } catch (_) { /* ignore */ }
  stopRun(); location.reload();
}
function initLegal() {
  $("#flinks").innerHTML = TABS.map(([k, n]) => `<button class="lk" data-l="${k}">${esc(n)}</button>`).join("") + `<span>© 2026 ${esc(LEGAL.owner)} · MIT License</span>`;
  document.addEventListener("click", e => {
    const b = e.target.closest("[data-l]");
    if (b) openLegal(b.dataset.l);
    const t = e.target.closest("[data-tab]");
    if (t) { showTab(t.dataset.tab); $("#tab-" + curTab).focus(); }
    if (e.target.id === "wipeData") wipeData();
    if (e.target === $("#legal")) closeLegal();
  });
  $("#legalBtn").onclick = () => openLegal("terms");
  $("#legalClose").onclick = closeLegal;
  $("#consentOk").onclick = acceptTerms;
  document.addEventListener("keydown", e => {
    if (!legalOpen()) return;
    if (e.key === "Escape") { e.preventDefault(); closeLegal(); return; }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      const t = e.target.closest && e.target.closest("[data-tab]");
      if (t) {
        e.preventDefault();
        const i = TABS.findIndex(x => x[0] === curTab), n = (i + (e.key === "ArrowRight" ? 1 : TABS.length - 1)) % TABS.length;
        showTab(TABS[n][0]); $("#tab-" + curTab).focus();
      }
      return;
    }
    if (e.key === "Tab") {
      const f = [...$("#legal").querySelectorAll("button, [tabindex='0']")].filter(x => !x.disabled && x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
  if (!hasConsent()) $("#consent").classList.add("on");
}

M = loadSaved() || demo();
buildPalette(); initLegal(); rebuild(); settle(); applyView(); render(); buildProps(); commit();
